server:
  port: 8081

mongodb:
  uri: "mongodb://imagegen_app:changeme_app@localhost:27017/imagegen"
  database: imagegen

rabbitmq:
  uri: "amqp://admin:changeme_rabbit@localhost:5672/"

openai:
  api_key: "${OPENAI_API_KEY}"
  base_url: "https://api.cphone.vip"

oss:
  bucket: "${OSS_BUCKET}"
  endpoint: "${OSS_ENDPOINT}"
  access_key: "${OSS_ACCESS_KEY}"
  secret_key: "${OSS_SECRET_KEY}"

worker:
  concurrency: 5
  timeout_sec: 150
  max_retry: 2

auth:
  jwt_secret: "imagegen-dev-secret-change-in-production"
  admin_user: "admin"
  admin_pass: "admin123"
