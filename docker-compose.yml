services:
  # ── 基础设施 ──────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: imagegen_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS}
      MONGO_INITDB_DATABASE: imagegen
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - imagegen_net

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: imagegen_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"    # AMQP 协议端口（Go 后端连接）
      - "15672:15672"  # Management UI（浏览器访问：http://localhost:15672）
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    networks:
      - imagegen_net

  # ── 应用服务 ──────────────────────────────────────────
  backend:
    image: imagegen-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: imagegen_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - mongo
      - rabbitmq
    networks:
      - imagegen_net

  frontend:
    image: imagegen-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: imagegen_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - imagegen_net

volumes:
  mongo_data:
  rabbitmq_data:

networks:
  imagegen_net:
    driver: bridge
